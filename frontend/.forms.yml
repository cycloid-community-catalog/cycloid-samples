# Define the stack configuration form and organize inputs of various types into sections and groups.
# See: https://docs.staging.cycloid.io/deploy/stackforms/file-format.html
use_cases:
  - name: aws
    sections:
      - name: Configurations
        groups:
          - name: Infrastructure
            technologies: [pipeline]
            vars:
              - name: "Application"
                description: "Application Load balancer on top of AWS ECS cluster"
                key: ecs_inventory
                type: "string"
                widget: cy_inventory_resource
                widget_config:
                  attribute: arn
                  filters:
                    provider: aws
                    project: ($ .project $)
                    environment: ($ .environment $)
                    type: aws_alb
                    # attributes: 'arn[rlike]="*:${aws_default_region}:*'
                required: true

  - name: azure
    sections:
      - name: Configurations
        groups:
          - name: Infrastructure
            technologies: [terraform]
            vars:
              - name: "Application to expose"
                description: "Select the application deployed in Azure Container Apps"
                key: container_app_name
                type: string
                widget: cy_inventory_resource
                widget_config:
                  attribute: name
                  filters:
                    project: ($ .project $)
                    environment: ($ .environment $)
                    provider: azurerm
                    type: azurerm_container_app
                required: true
                default: "app-petclinic"
