---
version: "2"
use_cases:
- name: default
  sections:
  - name: DG
    groups:
    - name: DG Specifications
      technologies: [pipeline]
      vars:
      - name: "DG Code"
        description: "The code of the DG."
        key: dg_name
        widget: simple_text
        type: string
        validations: 
        - regexp: "^[a-z0-9-]+$" 
          error_message: "Please enter a valid DG name."
        required: true

    - name: Amazon Web Services
      technologies: [pipeline]
      vars:
      - name: "Provision an AWS account in the new DG?"
        description: "Shall we provision an AWS account in the new DG?"
        key: aws_sel
        widget: switch
        type: boolean
        value: false
        required: false

    - name: Amazon Web Services Specifications
      technologies: [pipeline]
      condition: "$aws_sel == true"
      vars:
      - name: "AWS Account"
        description: "The AWS account where the DG could deploy the infrastructure."
        key: aws_cred_child
        widget: cy_cred
        widget_config:
          display_keys: false
          cred_types:
            - aws
        type: string
        default: "((aws))"
        required: true

    - name: Azure
      technologies: [pipeline]
      vars:
      - name: "Provision an Azure account in the new DG?"
        description: "Shall we provision an Azure account in the new DG?"
        key: azure_sel
        widget: switch
        type: boolean
        value: false
        required: false

    - name: Azure Specifications
      technologies: [pipeline]
      condition: "$azure_sel == true"
      vars:
      - name: "Azure Account"
        description: "The Azure account where the DG could deploy the infrastructure."
        key: azure_cred_child
        widget: cy_cred
        widget_config:
          display_keys: false
          cred_types:
            - azure
        type: string
        default: "((azure))"
        required: true

    - name: Service Owners
      technologies: [pipeline]
      vars:
      - name: "Service Owners"
        description: "The Service Owners who should given access to the DG."
        key: service_owners
        type: array
        values:
        - {label: "Olivier de Turckheim", value: olivier.deturckheim@cycloid.io}
        - {label: "foo bar", value: foo@bar}
        widget: dropdown
        widget_config:
          multiselect: true

    - name: Service Maintainers
      technologies: [pipeline]
      vars:
      - name: "Service Maintainers"
        description: "The Service Maintainers who should given access to the DG."
        key: service_maintainers
        type: array
        values:
        - {label: "Olivier de Turckheim", value: olivier.deturckheim@cycloid.io}
        - {label: "foo bar", value: foo@bar}
        widget: dropdown
        widget_config:
          multiselect: true

