---
version: "2"
use_cases:
- name: default
  sections:
  - name: IS
    groups:
    - name: IS Specifications
      technologies: [pipeline]
      vars:
      - name: "IS Code"
        description: "The code of the IS."
        key: is_name
        widget: simple_text
        type: string
        validations: 
        - regexp: "^[a-z0-9-]+$" 
          error_message: "Please enter a valid IS code (only alphanumeric chars)."
        required: true

    - name: Customer Admins
      technologies: [pipeline]
      vars:
      - name: "Customer Admins"
        description: "The Customer Admins who should given access to the IS. These users will be assigned the CustomerAdmin RBAC role."
        key: customer_admins
        type: array
        values:
        - {label: "Antony Di Maiolo", value: antony.dimaiolo@arhs-spikeseed.com}
        - {label: "Nicolas Buisson", value: nicolas.buisson@arhs-spikeseed.com}
        - {label: "Nicolas Labrot", value: nicolas.labrot@arhs-spikeseed.com}
        - {label: "Juan Gonzalez", value: juan-miguel.gonzalez-silva@ec.europa.eu}
        - {label: "Joseph Rizzo", value: joseph.rizzo@arhs-spikeseed.com}
        - {label: "Inalinda Fonseca", value: inalinda.fonseca@ext.ec.europa.eu}
        - {label: "Pierre Schrepel", value: pierre.schrepel@ext.ec.europa.eu}
        - {label: "Olivier de Turckheim", value: olivier.deturckheim@cycloid.io}
        widget: dropdown
        widget_config:
          multiselect: true

    - name: Customer Users
      technologies: [pipeline]
      vars:
      - name: "Customer Users"
        description: "The Customer Users who should given access to the IS. These users will be assigned the CustomerUser RBAC role."
        key: customer_users
        type: array
        values:
        - {label: "Antony Di Maiolo", value: antony.dimaiolo@arhs-spikeseed.com}
        - {label: "Nicolas Buisson", value: nicolas.buisson@arhs-spikeseed.com}
        - {label: "Nicolas Labrot", value: nicolas.labrot@arhs-spikeseed.com}
        - {label: "Juan Gonzalez", value: juan-miguel.gonzalez-silva@ec.europa.eu}
        - {label: "Joseph Rizzo", value: joseph.rizzo@arhs-spikeseed.com}
        - {label: "Inalinda Fonseca", value: inalinda.fonseca@ext.ec.europa.eu}
        - {label: "Pierre Schrepel", value: pierre.schrepel@ext.ec.europa.eu}
        - {label: "Olivier de Turckheim", value: olivier.deturckheim@cycloid.io}
        widget: dropdown
        widget_config:
          multiselect: true

    - name: Network
      technologies: [pipeline]
      vars:
      - name: "Network Pre-Provisioning"
        description: "Whether Network resources shall be pre-provisionned for this IS."
        key: network_provisioning
        type: boolean
        widget: switch
