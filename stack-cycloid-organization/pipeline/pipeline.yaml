# YAML anchors
shared:
# Task : sync and merge with rsync 2 rep. Used to merge stack and config
- &merge-stack-and-config
  platform: linux
  image_resource:
    type: registry-image
    source:
      repository: cycloid/cycloid-toolkit
      tag: latest
  run:
    path: /usr/bin/merge-stack-and-config


resource_types:
- name: terraform
  type: registry-image
  source:
    repository: cycloid/terraform-resource
    tag: ((terraform_version))


resources:
- name: tfstate
  type: terraform
  icon: terraform
  source:
    env_name: ($ .environment $)
    backend_type: http
    backend_config:
      address: '($ .api_url $)/inventory?jwt=($ .inventory_jwt $)'
    vars:
      aws_cred: ((aws_cred))
      aws_region: ((aws_region))
      cycloid_root_org_canonical: ((cycloid_root_org_canonical))
      cycloid_root_org_jwt: ((cycloid_root_org_jwt))
      cycloid_api_url: ($ .api_url $)
      github_pat: ((github_pat))
      env: ($ .environment $)
      project: ($ .project $)
      customer: ($ .organization_canonical $)


# The Terraform stack (will be merged with the config)
- name: git_stack-terraform
  type: git
  icon: github-circle
  source:
    uri: ($ .scs_url $)
    branch: ($ .scs_branch $)
    ($- if eq .scs_cred_type "basic_auth" $)
    username: ((($ .scs_cred_path $).username))
    password: ((($ .scs_cred_path $).password))
    ($- end $)
    ($- if eq .scs_cred_type "ssh" $)
    private_key: ((($ .scs_cred_path $).ssh_key))
    ($- end $)
    paths:
      - ($ .stack_path $)/terraform/*

# The Terraform config (will be merged with the stack)
- name: git_config-terraform
  type: git
  icon: github-circle
  source:
    uri: ($ .cr_url $)
    branch: ($ .cr_branch $)
    ($- if eq .cr_cred_type "basic_auth" $)
    username: ((($ .cr_cred_path $).username))
    password: ((($ .cr_cred_path $).password))
    ($- end $)
    ($- if eq .cr_cred_type "ssh" $)
    private_key: ((($ .cr_cred_path $).ssh_key))
    ($- end $)
    paths:
      - ($ .project $)/terraform/($ .environment $)/*

groups:
- name: overview
  jobs:
    - terraform-plan
    - terraform-apply
    # - set-subscription

- name: destroy
  jobs:
    - terraform-destroy


jobs:
  # Merge and trigger a plan whenever there is a commit in Terraform stack or config
  - name: terraform-plan
    serial: true
    max_in_flight: 1
    build_logs_to_retain: 10
    plan:
      - in_parallel:
        - get: git_stack-terraform
          trigger: true

        - get: git_config-terraform
          trigger: true

      - task: create-subscription
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: cycloid/cycloid-toolkit
              tag: latest
          run:
            path: /bin/bash
            args:
            - -ec
            - |
              DIR=${PWD}

              export AWS_ACCESS_KEY_ID=$(echo ${AWS_CRED} | jq -r .access_key)
              export AWS_SECRET_ACCESS_KEY=$(echo ${AWS_CRED} | jq -r .secret_key)
              export AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}

              cat <<-EOF >cmd-template.sh
              #!/bin/bash
              aws ssm start-session \
                --document-name 'AWS-StartNonInteractiveCommand' \
                --target "${INSTANCE_ID}" \
                --parameters '{"command": ["sudo docker exec -i cycloid-api sh -c \"./youdeploy-http-api create-subscription --config-file /opt/config.yml --overwrite --organization-canonical ${CHILD_ORG} --plan-canonical ${PLAN} --members-count ${SUBS} --expiration-date ${EXP}T23:59:59Z\""]}'
              EOF
              envsubst < cmd-template.sh > cmd.sh
              chmod 755 cmd.sh
              ./cmd.sh

              echo "Subscription set to ${PLAN} for ${SUBS} users until ${EXP} for organization ${CHILD_ORG}."

          params:
            AWS_CRED: ((aws_cred))
            AWS_DEFAULT_REGION: ((aws_region))
            CHILD_ORG: '($ .environment $)'
            PLAN: '((plan_canonical))'
            SUBS: '((members_count))'
            EXP: '((expiration_date))'
            INSTANCE_ID: '((cycloid_core_instance_id))'

      - task: merge-stack-and-config
        config:
          <<: *merge-stack-and-config
          inputs:
          - name: git_config-terraform
            path: "config"
          - name: git_stack-terraform
            path: "stack"
          outputs:
          - name: merged-stack
            path: "merged-stack"
        params:
          CONFIG_PATH: ($ .project $)/terraform/($ .environment $)
          STACK_PATH: ($ .stack_path $)/terraform

      - put: tfstate
        params:
          plan_only: true
          terraform_source: merged-stack/


  # Merge and trigger an apply whenever there is a terraform plan passed successfully
  - name: terraform-apply
    serial: true
    max_in_flight: 1
    build_logs_to_retain: 10
    plan:
      - in_parallel:
        - get: git_stack-terraform
          trigger: false
          passed:
            - terraform-plan

        - get: git_config-terraform
          trigger: false
          passed:
            - terraform-plan

        - get: tfstate
          trigger: true
          passed:
            - terraform-plan

      - task: merge-stack-and-config
        config:
          <<: *merge-stack-and-config
          inputs:
          - name: git_config-terraform
            path: "config"
          - name: git_stack-terraform
            path: "stack"
          outputs:
          - name: merged-stack
            path: "merged-stack"
        params:
          CONFIG_PATH: ($ .project $)/terraform/($ .environment $)
          STACK_PATH: ($ .stack_path $)/terraform

      - put: tfstate
        params:
          plan_run: true
          terraform_source: merged-stack/

  # - name: set-subscription
  #   max_in_flight: 1
  #   build_logs_to_retain: 10
  #   plan:
  #     - get: tfstate
  #       trigger: true
  #       passed:
  #         - terraform-apply

  #     - task: set-subscription
  #       config:
  #         platform: linux
  #         image_resource:
  #           type: registry-image
  #           source:
  #             repository: cycloid/cycloid-toolkit
  #             tag: latest
  #         run:
  #           path: /bin/bash
  #           args:
  #           - -ecx
  #           - |
  #             DIR=${PWD}

  #             mkdir -p ${DIR}/.ssh
  #             echo "${KEY}" >${DIR}/.ssh/cycloid-saas-us-aws
  #             chmod 600 ${DIR}/.ssh/cycloid-saas-us-aws
  #             eval "$(ssh-agent -s)"
  #             ssh-add ${DIR}/.ssh/cycloid-saas-us-aws

  #             ssh -J admin@${BASTION} admin@${CORE} \
  #             'sudo docker exec -i cycloid-api \
  #             sh -c "./youdeploy-http-api create-subscription --config-file /opt/config.yml --overwrite \
  #             --organization-canonical '${CHILD_ORG}' --plan-canonical '${PLAN}' --members-count '${SUBS}' --expiration-date '${EXP}'T23:59:59Z"'

  #             echo "Subscription set to ${PLAN} for ${SUBS} users until ${EXP} for organization ${CHILD_ORG}."

  #         params:
  #           BASTION: '((cycloid_bastion_ip))'
  #           CORE: '((cycloid_core_ip))'
  #           KEY: '((cycloid_ssh_private))'
  #           CHILD_ORG: '($ .environment $)'
  #           PLAN: '((plan_canonical))'
  #           SUBS: '((members_count))'
  #           EXP: '((expiration_date))'
  #         inputs:
  #         - name: tfstate


  # Destroy the infrastructure
  - name: terraform-destroy
    max_in_flight: 1
    build_logs_to_retain: 10
    plan:
      - in_parallel:
        - get: git_stack-terraform
          trigger: false
          passed:
            - terraform-plan

        - get: git_config-terraform
          trigger: false
          passed:
            - terraform-plan

        - get: tfstate
          trigger: false

      - task: merge-stack-and-config
        config:
          <<: *merge-stack-and-config
          inputs:
          - name: git_config-terraform
            path: "config"
          - name: git_stack-terraform
            path: "stack"
          outputs:
          - name: merged-stack
            path: "merged-stack"
        params:
          CONFIG_PATH: ($ .project $)/terraform/($ .environment $)
          STACK_PATH: ($ .stack_path $)/terraform

      - put: tfstate
        params:
          action: destroy
          terraform_source: merged-stack/
        get_params:
          action: destroy
