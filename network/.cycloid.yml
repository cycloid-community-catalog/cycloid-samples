version: "4"
name: Network
canonical: network
author: "cycloid-gael"
# Fill in the stack details.
description: "Create VPC and network requirements."
image: https://static.cycloid.io/sourcetree.svg
keywords:
  - "terraform"
  - "aws"
  - "digit"
  - "spring"
technologies:
  - technology: terraform
    version: 1.11.4
template: false
# Add use cases to the stack.
# See: https://docs.cycloid.io/manage/pipeline/multi-use-case.html#multiple-use-case
config:
  aws:
    name: "AWS"
    description: "Manage Amazon VPC and Subnet Services"
    cloud_provider: aws
    pipeline:
      pipeline:
        path: "pipeline/pipeline.yml"
      variables:
        path: "pipeline/variables.sample.yml"
        destination: "($ .config_root $)/pipeline/variables.yml"
    terraform:
      main:
        path: "terraform/aws/main.tf.sample"
        destination: "($ .config_root $)/terraform/main.tf"

  azure:
    name: "Azure"
    description: "Create a Resource Group and Virtual Network."
    cloud_provider: azurerm
    pipeline:
      pipeline:
        path: "pipeline/pipeline.yml"
      variables:
        path: "pipeline/variables.sample.yml"
        destination: "($ .config_root $)/pipeline/variables.yml"
    terraform:
      main:
        path: "terraform/azure/main.tf.sample"
        destination: "($ .config_root $)/terraform/main.tf"
