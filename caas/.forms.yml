# Define the stack configuration form and organize inputs of various types into sections and groups.
# See: https://docs.staging.cycloid.io/deploy/stackforms/file-format.html
use_cases:
  - name: aws
    sections:
      - name: Configurations
        groups:
          - name: Infrastructure
            technologies: [pipeline]
            vars:
              - name: "Database"
                description: "The database to use"
                key: database_inventory
                type: "string"
                widget: cy_inventory_resource
                widget_config:
                  attribute: arn
                  filters:
                    provider: aws
                    project: ($ .project $)
                    environment: ($ .environment $)
                    type: aws_rds_cluster
                    # attributes: 'arn[rlike]="*:${aws_default_region}:*'
                required: true

          - name: Application
            technologies: [pipeline]
            vars:
              - name: "Gitlab Project"
                description: "Gitlab project associeted to the application"
                key: demo_gitlab_project
                widget: text_area
                type: simple_text
                default: ($ .project $)

              - name: "Application Version"
                description: "Version of your application to deploy"
                key: web_image_version
                widget: text_area
                type: simple_text
                default: "latest"

              # - name: "Additional environnement variables"
              #   description: "Provide additional environnement variables"
              #   key: web_env
              #   widget: text_area
              #   type: map
              #   default:
              #     MY_ENV_VAR: my_value

  - name: azure
    sections:
      - name: Cloud provider
        groups:
          - name: Access
            technologies: [pipeline]
            vars:
              - name: "Azure environment"
                description: "The Cloud Environment which should be used"
                key: azure_env
                type: string
                widget: hidden
                default: "public"
              - name: "Azure credential"
                description: "The azure credential containing subscription_id, tenant_id, client_id, client_secret"
                key: azure_cred
                type: string
                widget: cy_cred
                widget_config:
                  display_keys: false
                  cred_types: [azure]
                default: "((azure-production))"

      - name: App
        groups:
          - name: Configuration
            technologies: [terraform]
            vars:
              - name: "Database server to use"
                key: db_name
                type: string
                widget: cy_inventory_resource
                widget_config:
                  attribute: name
                  filters:
                    project: ($ .project $)
                    environment: ($ .environment $)
                    provider: azurerm
                    type: azurerm_postgresql_flexible_server
                required: true
                default: "db-postgres"
