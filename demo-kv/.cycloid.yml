version: "4"
name: KV DB
canonical: kv-db
author: "florian"
# Fill in the stack details.
description: "Allow you to deploy KV DB."
image: https://static.cycloid.io/documentdb.svg
keywords:
  - "azure"
  - "aws"
  - "digit"
  - "demo"
  - "kv-db"
template: false
config:
  aws:
    name: "AWS"
    cloud_provider: aws
    pipeline:
      pipeline:
        path: "pipeline/pipeline.yml"
      variables:
        path: "pipeline/variables.sample.yml"
        destination: "($ .config_root $)/pipeline/variables.yml"

  azure:
    name: "Azure"
    cloud_provider: azurerm
    pipeline:
      pipeline:
        path: "pipeline/pipeline.yml"
      variables:
        path: "pipeline/variables.sample.yml"
        destination: "($ .config_root $)/pipeline/variables.yml"
