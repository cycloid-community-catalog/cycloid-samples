version: "4"
name: Storage
canonical: storage
author: "florian"
# Fill in the stack details.
description: "Allow you to deploy Storage."
image: https://static.cycloid.io/object-storage.png
keywords:
  - "azure"
  - "aws"
  - "digit"
  - "demo"
  - "storage"
template: false
config:
  aws:
    name: "AWS"
    cloud_provider: aws
    pipeline:
      pipeline:
        path: "pipeline/pipeline.yml"
      variables:
        path: "pipeline/variables.sample.yml"
        destination: "($ .config_root $)/pipeline/variables.yml"

  azure:
    name: "Azure"
    cloud_provider: azurerm
    pipeline:
      pipeline:
        path: "pipeline/pipeline.yml"
      variables:
        path: "pipeline/variables.sample.yml"
        destination: "($ .config_root $)/pipeline/variables.yml"
