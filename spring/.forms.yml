# Define the stack configuration form and organize inputs of various types into sections and groups.
# See: https://docs.staging.cycloid.io/deploy/stackforms/file-format.html
use_cases:
  - name: aws
    sections:
      - name: Cloud provider
        groups:
          - name: Access
            technologies: [pipeline]
            vars:
              # - name: "Aws region"
              #   key: aws_default_region
              #   type: string
              #   widget: auto_complete
              #   values:
              #     [
              #       "eu-north-1",
              #       "ap-south-1",
              #       "eu-west-3",
              #       "eu-west-2",
              #       "eu-west-1",
              #       "ap-northeast-2",
              #       "ap-northeast-1",
              #       "sa-east-1",
              #       "ca-central-1",
              #       "ap-southeast-1",
              #       "ap-southeast-2",
              #       "eu-central-1",
              #       "us-east-1",
              #       "us-east-2",
              #       "us-west-1",
              #       "us-west-2",
              #     ]
              #   default: "eu-west-1"

              # - name: "AWS access key"
              #   description: "AWS access key which should be used"
              #   key: aws_cred
              #   type: string
              #   widget: cy_cred
              #   widget_config:
              #     display_keys: false
              #     cred_types: [aws]
              #   default: "((aws_demo_automation_admin))"

              - name: "Database"
                key: database_inventory
                type: "string"
                widget: cy_inventory_resource
                widget_config:
                  attribute: arn
                  filters:
                    provider: aws
                    project: ($ .project $)
                    environment: ($ .environment $)
                    type: aws_rds_cluster
                    # attributes: 'arn[rlike]="*:${aws_default_region}:*'
                required: true

      - name: Infrastructure
        groups:
          - name: Configuration
            technologies: [terraform]
            vars:
              # - name: "Database"
              #   key: database_cluster_identifier
              #   type: "string"
              #   widget: cy_inventory_resource
              #   widget_config:
              #     attribute: cluster_identifier
              #     filters:
              #       provider: aws
              #       project: ($ .project $)
              #       environment: ($ .environment $)
              #       type: aws_rds_cluster
              #       # attributes: 'arn[rlike]="*:${aws_default_region}:*'
              #   required: true

              - name: "Extra environnement variables"
                key: web_env
                widget: text_area
                type: map
                default:
                  MY_ENV_VAR: my_value

  - name: azure
    sections:
      - name: Cloud provider
        groups:
          - name: Access
            technologies: [pipeline]
            vars:
              - name: "Azure environment"
                description: "The Cloud Environment which should be used"
                key: azure_env
                type: string
                widget: hidden
                default: "public"
              - name: "Azure credential"
                description: "The azure credential containing subscription_id, tenant_id, client_id, client_secret"
                key: azure_cred
                type: string
                widget: cy_cred
                widget_config:
                  display_keys: false
                  cred_types: [azure]
                default: "((azure-production))"

      - name: App
        groups:
          - name: Configuration
            technologies: [terraform]
            vars:
              - name: "Database server to use"
                key: db_name
                type: string
                widget: cy_inventory_resource
                widget_config:
                  attribute: name
                  filters:
                    project: ($ .project $)
                    environment: ($ .environment $)
                    provider: azurerm
                    type: azurerm_postgresql_flexible_server
                required: true
                default: "db-postgres"
