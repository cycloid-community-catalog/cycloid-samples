# Declare YAML anchors to reuse later in the YAML document.
# This helps reducing bloat in YAML files by removing code duplication.
# See: https://docs.cycloid.io/deploy/stackforms/advanced.html#yaml-anchors-and-aliases
definitions:
  tasks:
    # The task producing a configured stack, merging stack and config.
    - &task-merge-stack-and-config
      task: merge-stack-and-config
      config:
        platform: linux
        image_resource:
          type: registry-image
          source:
            repository: cycloid/cycloid-toolkit
            tag: latest
        run:
          path: /bin/bash
          args:
            - -ec
            - |
              /usr/bin/merge-stack-and-config

              # Get the image to use
              if [[ -d "./image/" ]]; then
                echo -e "# \e[33mReading image\e[0m"
                echo "Adding terraform variable: web_image"
                echo "web_image = \"$IMAGE_REPO:$(cat image/tag)\"" >> merged-stack/terraform.tfvars
                echo "Adding terraform variable: web_image_digest"
                echo "web_image_digest = \"$(cat image/digest)\"" >> merged-stack/terraform.tfvars
                cat merged-stack/terraform.tfvars
              fi
        inputs:
          - name: git_config
            path: "config"
          - name: git_stack
            path: "stack"
          - name: image_spring
            path: "image"
        outputs:
          - name: merged-stack
            path: "merged-stack"
      params:
        IMAGE_REPO: "cycloid/spring-framework-petclinic"
        CONFIG_PATH: ($ .config_root $)/terraform
        STACK_PATH: ($ .stack_path $)/terraform/($ .use_case $)

# Declare Concourse resource types to determine versions and sources to use in the pipeline.
# See: https://concourse-ci.org/resource-types.html
resource_types:
- name: terraform
  type: registry-image
  source:
    repository: cycloid/terraform-resource
    tag: '1.11.4'

# Declare resources to be invoked later in jobs.
resources:
# The Terraform Concourse resource to manage infrastructure via Terraform.
# See: https://github.com/cycloidio/terraform-resource#source-configuration
- name: tfstate
  type: terraform
  icon: terraform
  source:
    # Use Cycloid Terraform HTTP backend.
    backend_type: http
    backend_config:
      address: '($ .api_url $)/inventory?jwt=($ .inventory_jwt $)'
      skip_cert_verification: true
    env_name: ($ .environment $)
    vars:
      env: ($ .environment $)
      project: ($ .project $)
      organization: ($ .organization $)
      component: ($ .component $)
      ($- if eq .use_case "aws" $)
      aws_cred: ((aws-production))
      # aws_region: ((aws_default_region)) # determined with database_inventory
      database_inventory: ((database_inventory))
      ($- else if eq .use_case "azure" $)
      azure_env: ((azure_env))
      azure_cred: ((azure-production))
      ($- end $)

# The Terraform stack (will be merged with the config).
- name: git_stack
  type: git
  icon: github-circle
  source:
    uri: ($ .catalog_repository_url $)
    branch: ($ .catalog_repository_branch $)
    # Stack templating examples:
    # https://docs.cycloid.io/reference/stack/concepts/templating/
    ($- if eq .catalog_repository_credential_type "basic_auth" $)
    username: ((($ .catalog_repository_credential_path $).username))
    password: ((($ .catalog_repository_credential_path $).password))
    ($- end $)
    ($- if eq .catalog_repository_credential_type "ssh" $)
    private_key: ((($ .catalog_repository_credential_path $).ssh_key))
    ($- end $)
    # Include only the Terraform files in the specified directory.
    paths:
      - ($ .stack_path $)/terraform/($ .use_case $)/*

# The Terraform config (will be merged with the stack).
- name: git_config
  type: git
  icon: github-circle
  source:
    uri: ($ .config_repository_url $)
    branch: ($ .config_repository_branch $)
    ($- if eq .config_repository_credential_type "basic_auth" $)
    username: ((($ .config_repository_credential_path $).username))
    password: ((($ .config_repository_credential_path $).password))
    ($- end $)
    ($- if eq .config_repository_credential_type "ssh" $)
    private_key: ((($ .config_repository_credential_path $).ssh_key))
    ($- end $)
    # Include only the Terraform files in the specified directory.
    paths:
      - ($ .config_root $)/terraform/*

- name: image_spring
  type: registry-image
  icon: docker
  source:
    repository: "cycloid/spring-framework-petclinic"
    tag: latest
    # username: nologin
    # password: ((ecr.secret_key))

# Define jobs that form the pipeline
jobs:
  - name: deploy
    serial: true
    serial_groups: [terraform]
    build_logs_to_retain: 10
    plan:
      - do:
        - in_parallel:
            steps:
            - get: git_stack
              trigger: true
            - get: git_config
              trigger: true
            - get: image_spring
              trigger: true
        - *task-merge-stack-and-config
        - put: tfstate
          params:
            terraform_source: merged-stack/

  - name: destroy
    serial: true
    serial_groups: [terraform]
    build_logs_to_retain: 10
    plan:
      - do:
        - in_parallel:
            steps:
            - get: git_stack
              trigger: false
            - get: git_config
              trigger: false
            - get: image_spring
              trigger: false
        - *task-merge-stack-and-config
        - put: tfstate
          params:
            action: destroy
            terraform_source: merged-stack/
          get_params:
            action: destroy

# Organize jobs into groups.
# See: https://concourse-ci.org/pipelines.html#schema.pipeline.groups
groups:
- name: overview
  jobs:
  - deploy
- name: destroy
  jobs:
  - destroy
